<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>การอบรมตัวแทน | SSBMS</title>
  <style>
    :root{--blue:#1769d2;--blue2:#0d4fa8;--soft:#eef6ff;--ink:#102033;--muted:#64748b;--line:#dbe7f4;--ok:#16834f;--card:#fff;--shadow:0 16px 40px rgba(35,82,130,.12)}
    *{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Thai",sans-serif;background:linear-gradient(180deg,#f8fbff,#edf6ff);color:var(--ink)}
    button{font:inherit} .shell{max-width:1180px;margin:auto;padding:18px 14px 46px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px}.logo{width:50px;height:50px;border-radius:16px;background:linear-gradient(145deg,#2f8cff,#0d57b8);color:#fff;display:grid;place-items:center;font-weight:900;box-shadow:0 10px 24px rgba(23,105,210,.28)}.brand h1{margin:0;font-size:1.25rem}.brand p{margin:2px 0 0;color:var(--muted);font-size:.88rem}.logout{border:1px solid var(--line);background:#fff;border-radius:13px;padding:10px 14px;font-weight:800;cursor:pointer;color:var(--blue2)}
    .layout{display:grid;grid-template-columns:320px 1fr;gap:20px}.side,.main{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}.side{padding:20px;align-self:start;position:sticky;top:14px}.main{padding:24px}.eyebrow{display:inline-flex;background:var(--soft);color:var(--blue2);border-radius:999px;padding:7px 11px;font-size:.8rem;font-weight:800}.side h2{margin:14px 0 8px}.muted{color:var(--muted);line-height:1.65}.progress-wrap{margin:18px 0}.progress-label{display:flex;justify-content:space-between;font-weight:800;margin-bottom:8px}.bar{height:12px;background:#e8f0f8;border-radius:999px;overflow:hidden}.bar>div{height:100%;width:0;background:linear-gradient(90deg,#38a1ff,#1769d2);transition:.3s}.lesson-list{display:grid;gap:10px;margin-top:18px}.lesson-btn{width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}.lesson-btn.active{border-color:var(--blue);background:#f3f8ff}.lesson-btn.done{border-color:#bfe4d0;background:#f2fbf6}.num{width:30px;height:30px;border-radius:10px;background:var(--soft);display:grid;place-items:center;font-weight:900;color:var(--blue2);flex:0 0 auto}.lesson-btn.done .num{background:#dff5e9;color:var(--ok)}.lesson-btn strong{display:block}.lesson-btn span{display:block;color:var(--muted);font-size:.8rem;margin-top:2px}
    .hero{padding:22px;border-radius:20px;background:linear-gradient(135deg,#0d4fa8,#2f8cff);color:#fff;margin-bottom:18px}.hero h2{margin:0 0 8px;font-size:1.7rem}.hero p{margin:0;opacity:.9;line-height:1.7}.content-card{border:1px solid var(--line);border-radius:20px;padding:20px;background:#fff}.content-card h3{margin-top:0}.content-card ul{line-height:1.8;padding-left:22px}.video-box{aspect-ratio:16/9;border-radius:18px;background:linear-gradient(135deg,#dcecff,#f7fbff);display:grid;place-items:center;color:var(--blue2);font-weight:900;border:1px dashed #9ec8f3;margin:16px 0}.lesson-actions{display:flex;justify-content:space-between;gap:12px;margin-top:20px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:12px 16px;border-radius:14px;font-weight:900;cursor:pointer}.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.btn:disabled{opacity:.45;cursor:not-allowed}.message{display:none;margin-bottom:14px;padding:12px 14px;border-radius:13px;font-weight:700}.message.show{display:block}.message.ok{background:#edf9f3;color:#12623c;border:1px solid #bfe9d3}.message.err{background:#fff0f0;color:#8c1e1e;border:1px solid #ffd0d0}.exam-box{display:none;margin-top:20px;padding:18px;border-radius:18px;background:#edf9f3;border:1px solid #bfe9d3}.exam-box.show{display:block}.exam-box h3{margin:0 0 8px;color:#12623c}
    @media(max-width:850px){.layout{grid-template-columns:1fr}.side{position:static}.lesson-list{grid-template-columns:1fr 1fr}}@media(max-width:600px){.shell{padding:12px 9px 32px}.brand p{display:none}.layout{gap:14px}.side,.main{border-radius:20px}.side,.main{padding:16px}.lesson-list{grid-template-columns:1fr}.hero{padding:18px}.hero h2{font-size:1.35rem}.lesson-actions{display:grid}.btn{width:100%}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="top">
      <div class="brand"><div class="logo">SSB</div><div><h1>การอบรมตัวแทน SSB</h1><p>บริษัท สยามทำ จำกัด</p></div></div>
      <button class="logout" id="logoutBtn">ออกจากระบบ</button>
    </header>

    <div id="message" class="message"></div>

    <main class="layout">
      <aside class="side">
        <span class="eyebrow">หลักสูตรรับรองตัวแทน</span>
        <h2 id="agentName">กำลังโหลดข้อมูล...</h2>
        <p class="muted">เรียนให้ครบทุกบท ระบบจะเปิดข้อสอบให้โดยอัตโนมัติ</p>
        <div class="progress-wrap">
          <div class="progress-label"><span>ความคืบหน้า</span><span id="progressText">0%</span></div>
          <div class="bar"><div id="progressBar"></div></div>
        </div>
        <div class="lesson-list" id="lessonList"></div>
      </aside>

      <section class="main">
        <div class="hero">
          <h2 id="lessonTitle">บทเรียนตัวแทน SSB</h2>
          <p id="lessonSubtitle">เลือกบทเรียนจากเมนูด้านซ้ายเพื่อเริ่มการอบรม</p>
        </div>

        <article class="content-card">
          <div id="lessonContent"></div>
          <div class="lesson-actions">
            <button class="btn" id="prevBtn">ย้อนกลับ</button>
            <button class="btn primary" id="completeBtn">ทำเครื่องหมายว่าเรียนจบบทนี้</button>
            <button class="btn" id="nextBtn">บทถัดไป</button>
          </div>
        </article>

        <div class="exam-box" id="examBox">
          <h3>อบรมครบแล้ว</h3>
          <p>ระบบได้ปลดล็อกข้อสอบรับรองตัวแทนให้คุณแล้ว</p>
          <button class="btn primary" id="goExamBtn">เข้าสู่การสอบ</button>
        </div>
      </section>
    </main>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwxuLFd3Udc9m7OI3XtdvRFDK2pUpUB5mWo0M8d4YF5ak_m6xJ8BuCt8na2t75LpXi3Gw/exec";
    const SESSION_KEY = "ssb_agent_session";
    const LOCAL_KEY = "ssb_training_completed_lessons";

    const lessons = [
      {title:"บทที่ 1 แนะนำบริษัทและระบบ SSB",subtitle:"ทำความเข้าใจภาพรวมของบริษัท ผลิตภัณฑ์ และบทบาทของตัวแทน",html:`<h3>วัตถุประสงค์ของบทเรียน</h3><ul><li>รู้จักบริษัท สยามทำ จำกัด และแนวทางการดำเนินงาน</li><li>เข้าใจภาพรวมของระบบ SSB และ SSBMS</li><li>เข้าใจหน้าที่ ความรับผิดชอบ และขอบเขตของตัวแทน</li></ul><div class="video-box">พื้นที่วิดีโออบรมบทที่ 1</div><p class="muted">สามารถนำลิงก์วิดีโอจริงมาใส่ภายหลังได้</p>`},
      {title:"บทที่ 2 ความรู้เกี่ยวกับผลิตภัณฑ์",subtitle:"เรียนรู้องค์ประกอบ ประโยชน์ และแนวทางอธิบายผลิตภัณฑ์แก่ลูกค้า",html:`<h3>หัวข้อสำคัญ</h3><ul><li>องค์ประกอบของระบบ SSB</li><li>ความแตกต่างระหว่างสินค้าแต่ละแบบ</li><li>ประโยชน์ต่อผู้ใช้งานทั่วไป</li><li>ข้อควรระวังในการให้ข้อมูลลูกค้า</li></ul><div class="video-box">พื้นที่วิดีโออบรมบทที่ 2</div>`},
      {title:"บทที่ 3 ขั้นตอนการขายและบริการลูกค้า",subtitle:"ฝึกกระบวนการนำเสนอ การรับคำสั่งซื้อ และการติดตามลูกค้า",html:`<h3>ขั้นตอนมาตรฐาน</h3><ul><li>รับฟังปัญหาและความต้องการของลูกค้า</li><li>นำเสนอผลิตภัณฑ์ตามข้อมูลจริง</li><li>อธิบายราคา เงื่อนไข และขั้นตอนสั่งซื้ออย่างชัดเจน</li><li>ติดตามสถานะและบริการหลังการขาย</li></ul><div class="video-box">พื้นที่วิดีโออบรมบทที่ 3</div>`},
      {title:"บทที่ 4 จรรยาบรรณและข้อกำหนด",subtitle:"ยึดหลักความสุจริต ไม่กล่าวอ้างเกินจริง และรักษาข้อมูลลูกค้า",html:`<h3>จรรยาบรรณตัวแทน</h3><ul><li>ไม่ให้ข้อมูลอันเป็นเท็จหรือเกินจริง</li><li>ไม่เปิดเผยข้อมูลส่วนบุคคลของลูกค้า</li><li>ไม่เรียกเก็บเงินนอกเหนือจากที่บริษัทกำหนด</li><li>ปฏิบัติตามกฎหมายและข้อกำหนดของบริษัท</li></ul><div class="video-box">พื้นที่วิดีโออบรมบทที่ 4</div>`},
      {title:"บทที่ 5 ค่าตอบแทน ทีมงาน และ Dashboard",subtitle:"เรียนรู้สิทธิ์ตัวแทน ระบบรายได้ การถอนเงิน และการทำงานกับแม่ทีม",html:`<h3>สิ่งที่ตัวแทนจะใช้งาน</h3><ul><li>รหัสตัวแทนและลิงก์แนะนำ</li><li>ยอดขาย รายได้ โบนัส และภาษี</li><li>การถอนเงินและประวัติรายการ</li><li>ระบบแม่ทีม ลูกทีม และการติดตามผลงาน</li></ul><div class="video-box">พื้นที่วิดีโออบรมบทที่ 5</div>`}
    ];

    let session = null;
    let currentIndex = 0;
    let completed = [];

    function showMessage(type,text){const box=document.getElementById("message");box.className="message show "+type;box.textContent=text;setTimeout(()=>box.className="message",3000)}
    function getSession(){try{return JSON.parse(localStorage.getItem(SESSION_KEY)||"null")}catch(e){return null}}
    function getCompleted(){try{const v=JSON.parse(localStorage.getItem(LOCAL_KEY)||"[]");return Array.isArray(v)?v:[]}catch(e){return []}}
    function saveCompleted(){localStorage.setItem(LOCAL_KEY,JSON.stringify(completed))}
    function renderLessons(){const list=document.getElementById("lessonList");list.innerHTML=lessons.map((l,i)=>`<button class="lesson-btn ${i===currentIndex?'active':''} ${completed.includes(i)?'done':''}" data-index="${i}"><div class="num">${completed.includes(i)?'✓':i+1}</div><div><strong>${l.title}</strong><span>${completed.includes(i)?'เรียนจบแล้ว':'ยังไม่เรียนจบ'}</span></div></button>`).join("");list.querySelectorAll(".lesson-btn").forEach(b=>b.onclick=()=>{currentIndex=Number(b.dataset.index);renderAll()})}
    function renderContent(){const l=lessons[currentIndex];document.getElementById("lessonTitle").textContent=l.title;document.getElementById("lessonSubtitle").textContent=l.subtitle;document.getElementById("lessonContent").innerHTML=l.html;document.getElementById("prevBtn").disabled=currentIndex===0;document.getElementById("nextBtn").disabled=currentIndex===lessons.length-1;document.getElementById("completeBtn").textContent=completed.includes(currentIndex)?"บทนี้เรียนจบแล้ว":"ทำเครื่องหมายว่าเรียนจบบทนี้";document.getElementById("completeBtn").disabled=completed.includes(currentIndex)}
    function renderProgress(){const p=Math.round((completed.length/lessons.length)*100);document.getElementById("progressText").textContent=p+"%";document.getElementById("progressBar").style.width=p+"%";document.getElementById("examBox").classList.toggle("show",p===100);return p}
    function renderAll(){renderLessons();renderContent();renderProgress()}

    async function post(data){const res=await fetch(API_URL,{method:"POST",body:JSON.stringify(data)});return await res.json()}
    async function syncProgress(){const progress=renderProgress();const result=await post({action:"updateTrainingProgress",agent_id:session.agent_id,progress});if(!result.ok)throw new Error(result.message||"บันทึกความคืบหน้าไม่สำเร็จ");if(result.next_page==="agent-exam.html"&&progress===100){document.getElementById("examBox").classList.add("show")}}

    document.getElementById("completeBtn").onclick=async()=>{if(completed.includes(currentIndex))return;completed.push(currentIndex);completed.sort((a,b)=>a-b);saveCompleted();renderAll();try{await syncProgress();showMessage("ok","บันทึกบทเรียนเรียบร้อย")}catch(err){showMessage("err",err.message)}};
    document.getElementById("prevBtn").onclick=()=>{if(currentIndex>0){currentIndex--;renderAll()}};
    document.getElementById("nextBtn").onclick=()=>{if(currentIndex<lessons.length-1){currentIndex++;renderAll()}};
    document.getElementById("goExamBtn").onclick=()=>window.location.href="agent-exam.html";
    document.getElementById("logoutBtn").onclick=()=>{localStorage.removeItem(SESSION_KEY);window.location.href="agent-login.html"};

    async function init(){session=getSession();if(!session||!session.agent_id){window.location.href="agent-login.html";return}document.getElementById("agentName").textContent=session.name||session.agent_id;completed=getCompleted();renderAll();try{const res=await fetch(API_URL+"?action=getAgentStatus&agent_id="+encodeURIComponent(session.agent_id));const result=await res.json();if(!result.ok)throw new Error(result.message||"โหลดสถานะไม่สำเร็จ");if(result.status==="EXAM"){window.location.href="agent-exam.html";return}if(result.status==="WAIT_APPROVAL"){window.location.href="agent-waiting.html";return}if(result.status==="APPROVED"){window.location.href="agent-dashboard.html";return}if(Number(result.training_progress||0)>=100){completed=[0,1,2,3,4];saveCompleted();renderAll()}else if(Number(result.training_progress||0)>0&&completed.length===0){const count=Math.floor(Number(result.training_progress)/20);completed=Array.from({length:count},(_,i)=>i);saveCompleted();renderAll()}if(result.status==="REGISTERED"){await post({action:"startTraining",agent_id:session.agent_id})}}catch(err){showMessage("err",err.message)}}
    init();
  </script>
</body>
</html>
